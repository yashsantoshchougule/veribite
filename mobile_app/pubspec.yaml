name: mobile_app
description: Smart Packaged Product Ingredient, Toxicology & Safe Consumption Dosage Scanner
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  sqflite: ^2.4.1
  sqlite3_flutter_libs: ^0.5.24
  mobile_scanner: ^6.0.2
  google_mlkit_text_recognition: ^0.13.0
  image: ^4.3.0
  flutter_tts: ^4.2.0
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/mlkit/
    - assets/images/
